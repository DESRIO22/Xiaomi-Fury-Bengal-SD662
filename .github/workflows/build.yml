name: Build Kernel snuzzle-citrus (JuiceIcedSnow_OSS)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache clang curl flex lld llvm \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            git libelf-dev libffi-dev libgmp-dev libmpc-dev libmpfr-dev \
            libssl-dev libxml2-dev make python3 unzip zip zstd

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: JuiceIcedSnow_OSS
          fetch-depth: 1

      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3

      - name: Build kernel with Clang
        env:
          ARCH: arm64
          SUBARCH: arm64
          CC: clang
          CLANG_TRIPLE: aarch64-linux-gnu-
          CROSS_COMPILE: aarch64-linux-gnu-
          LLVM: 1
          LLVM_IAS: 1
          KBUILD_BUILD_USER: builder
          KBUILD_BUILD_HOST: github-actions
        run: |
          set -e
          DEFCONFIG="vendor/citrus-perf_defconfig"
          echo "Menggunakan defconfig: $DEFCONFIG"

          make O=out ARCH=$ARCH CC=$CC CLANG_TRIPLE=$CLANG_TRIPLE CROSS_COMPILE=$CROSS_COMPILE LLVM=$LLVM "$DEFCONFIG"

          ./scripts/config --file out/.config -d DEBUG_FS -d SCHED_DEBUG || true
          make O=out ARCH=$ARCH CC=$CC CLANG_TRIPLE=$CLANG_TRIPLE CROSS_COMPILE=$CROSS_COMPILE LLVM=$LLVM olddefconfig

          make -j4 O=out ARCH=$ARCH CC=$CC CLANG_TRIPLE=$CLANG_TRIPLE CROSS_COMPILE=$CROSS_COMPILE LLVM=$LLVM LOCALVERSION="-snuzzle-citrus"

      - name: Package AnyKernel3 zip
        run: |
          set -e
          IMAGE=$(find out/arch/arm64/boot -name "Image.gz-dtb" -o -name "Image.gz" -o -name "Image" | head -n 1)
          if [ -z "$IMAGE" ]; then
            echo "Kernel Image tidak ditemukan!"
            exit 1
          fi

          cp "$IMAGE" AnyKernel3/
          DTBO=$(find out/arch/arm64/boot -name "dtbo.img" | head -n 1)
          if [ -n "$DTBO" ]; then
            cp "$DTBO" AnyKernel3/
          fi

          cd AnyKernel3
          zip -r9 ../snuzzle-citrus.zip . -x ".git*"

      - name: Upload kernel zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: snuzzle-citrus
          path: snuzzle-citrus.zip
          
