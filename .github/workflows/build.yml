name: Build Kernel Citrus (JuiceIcedSnow_OSS)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-aarch64-linux-gnu \
            gcc-aarch64-linux-gnu git libelf-dev libffi-dev libgmp-dev \
            libmpc-dev libmpfr-dev libssl-dev libxml2-dev make python3 \
            unzip zip zstd clang lld llvm

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: JuiceIcedSnow_OSS
          fetch-depth: 1

      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3

      - name: Build kernel
        env:
          ARCH: arm64
          SUBARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
        run: |
          export KBUILD_BUILD_USER=builder
          export KBUILD_BUILD_HOST=github-actions

          echo "=== Daftar defconfig yang tersedia ==="
          find arch/arm64/configs -maxdepth 3 -name "*defconfig*" | sort

          DEFCONFIG=$(find arch/arm64/configs -maxdepth 3 \( -name "*citrus*defconfig*" -o -name "*juice*defconfig*" -o -name "*bengal*defconfig*" \) | head -n 1)
          echo "Terpilih: $DEFCONFIG"

          if [ -z "$DEFCONFIG" ]; then
            echo "Tidak ada defconfig citrus/juice/bengal yang cocok!"
            exit 1
          fi

          DEFCONFIG_NAME=$(basename "$DEFCONFIG")
          make O=out ARCH=$ARCH CROSS_COMPILE=$CROSS_COMPILE "$DEFCONFIG_NAME"

          ./scripts/config --file out/.config -d DEBUG_FS -d SCHED_DEBUG || true
          make O=out ARCH=$ARCH CROSS_COMPILE=$CROSS_COMPILE olddefconfig

          make -j$(nproc) O=out ARCH=$ARCH CROSS_COMPILE=$CROSS_COMPILE

      - name: Package AnyKernel3 zip
        run: |
          IMAGE=$(find out/arch/arm64/boot -name "Image.gz-dtb" -o -name "Image.gz" -o -name "Image" | head -n 1)
          if [ -z "$IMAGE" ]; then
            echo "Kernel Image tidak ditemukan!"
            exit 1
          fi

          cp "$IMAGE" AnyKernel3/
          DTBO=$(find out/arch/arm64/boot -name "dtbo.img" | head -n 1)
          if [ -n "$DTBO" ]; then
            cp "$DTBO" AnyKernel3/
          fi

          cd AnyKernel3
          zip -r9 ../Fury-Citrus-JuiceIcedSnow_OSS.zip . -x ".git*"

      - name: Upload kernel zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fury-Citrus-JuiceIcedSnow_OSS
          path: Fury-Citrus-JuiceIcedSnow_OSS.zip
          
